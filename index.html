<title>Daily Personal Tracker</title>
<style>

ight:220px;display:grid;align-items:center;margin-top:14px}.fin-bars{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:end;height:175px}.fin-col{display:grid;gap:8px;justify-items:center}.fin-track{height:140px;width:100%;max-width:110px;display:flex;align-items:end;background:var(--chip);border-radius:14px 14px 7px 7px;padding:5px}.fin-fill{width:100%;min-height:4px;border-radius:10px 10px 5px 5px;background:var(--accent)}.fin-label{font-size:11px;color:var(--muted)}.fin-value{font-size:13px;font-weight:680}.date-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}.schedule{display:grid;gap:8px}.slot{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px}.slot time{color:var(--muted);font-variant-numeric:tabular-nums}.slot input{padding:10px 12px}.slot-dot{width:10px;height:10px;border-radius:50%;background:var(--muted2)}.slot.filled .slot-dot{background:var(--accent)}.habit-tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.habit-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:20px;-webkit-overflow-scrolling:touch}.habit-table{border-collapse:separate;border-spacing:0;min-width:1240px;width:100%;font-size:11px}.habit-table th,.habit-table td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card);padding:6px;text-align:center}.habit-table th{position:sticky;top:0;z-index:4;background:var(--card2);color:var(--muted);font-weight:700}.habit-table th:first-child,.habit-table td:first-child{position:sticky;left:0;z-index:5;min-width:275px;text-align:left;background:var(--card2)}.habit-table tr.main td:first-child{font-weight:780;background:var(--card2)}.habit-main-name{font-weight:780}.habit-sub-name{padding-left:22px!important;color:var(--muted)}.habit-cell{width:30px;height:30px;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--chip)}. <body>
<div class="app"><main>
<section class="page active" id="dashboard"><div class="grid">
<article class="widget w8"><span class="num">01</span><h3 data-i18n="notesPreviewTitle"></h3><div class="preview" id="dashNote"></div></article>
<article class="widget w4"><span class="num">02</span><h3 data-i18n="stepsTitle"></h3><div class="stat" id="dashSteps">0</div><div class="small" data-i18n="today"></div></article>
<article class="widget w4"><span class="num">03</span><h3 data-i18n="habitsTitle"></h3><div class="stat" id="dashHabit">0%</div><div class="progress"><i id="dashHabitBar"></i></div><div class="small" id="dashHabitMeta"></div></article>
<article class="widget w8"><span class="num">04</span><h3 data-i18n="focusTitle"></h3><div class="stat" id="dashFocus">00:00:00</div><div class="small" data-i18n="today"></div></article>
<article class="widget w6"><span class="num">05</span><h3 data-i18n="financeTitle"></h3><div class="stat" id="dashBalance">0 ₽</div><div class="small" data-i18n="currentBalance"></div></article>
<article class="widget w6"><span class="num">06</span><h3 data-i18n="scheduleTitle"></h3><div class="stat" id="dashDate">—</div><div class="small" id="dashDay"></div></article>
<article class="widget w12"><span class="num">07</span><h3 data-i18n="settingsTitle"></h3><div class="settings-grid">
<div class="setting"><div class="setting-copy"><div class="setting-title" data-i18n="themeTitle"></div><div class="setting-sub" id="themeSub"></div></div><button class="switch" id="themeSwitch" type="button"><span class="switch-track"><span>☾</span><span>☀</span></span><span class="switch-knob" id="themeKnob">D</span></button></div>
<div class="setting"><div class="setting-copy"><div class="setting-title" data-i18n="languageTitle"></div><div class="setting-sub" id="langSub"></div></div><button class="switch" id="langSwitch" type="button"><span class="switch-track"><span>RU</span><span>EN</span></span><span class="switch-knob" id="langKnob">RU</span></button></div>
</div><div class="install-note" data-i18n="installNote"></div><button class="btn primary install-app" id="installApp" type="button" data-i18n="installApp"></button></article>
</div></section>
<section class="page" id="notes"><div class="section-head"><div><h1 data-i18n="notesTitle"></h1><p data-i18n="notesDesc"></p></div><div class="section-num">01</div></div><div class="card"><div class="form-grid"><div><label data-i18n="titleLabel"></label><input id="noteTitle" maxlength="120" data-ph="noteTitlePh"></div><div><label data-i18n="savedNoteLabel"></label><select id="notePicker"></select></div><div class="full"><label data-i18n="textLabel"></label><textarea id="noteBody" data-ph="noteBodyPh"></textarea></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" id="newNote" data-i18n="newNote"></button><button class="btn" id="saveNote" data-i18n="saveNote"></button><button class="btn danger" id="deleteNote" data-i18n="delete"></button><button class="btn" id="makePlan" data-i18n="makePlan"></button></div></div><div class="card"><div class="section-head"><div><h2 data-i18n="planTitle"></h2><p data-i18n="planDesc"></p></div></div><div id="plans" class="plan-list"></div></div><div class="card"><div class="section-head"><div><h2 data-i18n="savedNotes"></h2></div></div><div id="noteList" class="list"></div></div></section>
<section class="page" id="steps"><div class="section-head"><div><h1 data-i18n="stepsTitle"></h1><p data-i18n="stepsDesc"></p></div><div class="section-num">02</div></div><div class="card"><div class="steps-entry"><div><label><span data-i18n="today"></span> · <span id="stepsDateLabel"></span></label><div class="step-number" id="stepBig">0</div><div class="small" data-i18n="stepsToday"></div></div><div><label data-i18n="stepCountLabel"></label><div class="step-input-row"><input id="stepsInput" type="number" min="0" max="200000" step="1" inputmode="numeric" data-ph="stepsPh"><button class="btn primary" id="saveSteps" data-i18n="save"></button></div></div></div></div><div class="card chart-shell"><div class="section-head"><div><h2>Activity</h2></div></div><div class="chart-scroll"><div id="stepsChart" class="chart"></div></div></div></section>

function t(k,vars={}){let s=I18N[lang][k]??I18N.en[k]??k;Object.entries(vars).forEach(([a,b])=>s=s.replaceAll('{'+a+'}',String(b)));return s}

document.documentElement.dataset.theme=theme;applyI18n();updateThemeUI();$('#themeSwitch').onclick=()=>setTheme(theme==='dark'?'light':'dark');$('#langSwitch').onclick=()=>setLang(lang==='ru'?'en':'ru');

let notes=read(KEYS.notes,{notes:[],selectedId:null,plans:{}});if(!notes||!Array.isArray(notes.notes))notes={notes:[],selectedId:null,plans:{}};const saveNotes=()=>write(KEYS.notes,notes);
function renderNoteSelect(){const sel=$('#notePicker');sel.innerHTML='';if(!notes.notes.length){sel.innerHTML=`<option value="">${esc(t('noSavedNotes'))}</option>`;$('#noteTitle').value='';$('#noteBody').value='';return};if(!notes.selectedId||!notes.notes.some(n=>n.id===notes.selectedId))notes.selectedId=notes.notes.slice().sort((a,b)=>b.updatedAt-a.updatedAt)[0].id;notes.notes.forEach(n=>{const o=document.createElement('option');o.value=n.id;o.textContent=n.title||t('untitled');sel.append(o)});sel.value=notes.selectedId;const n=notes.notes.find(x=>x.id===notes.selectedId);$('#noteTitle').value=n?.title||'';$('#noteBody').value=n?.body||'';saveNotes()}
function renderNoteList(){const box=$('#noteList');if(!notes.notes.length){box.innerHTML=`<div class="empty">${esc(t('noNotes'))}</div>`;return};box.innerHTML=notes.notes.slice().sort((a,b)=>b.updatedAt-a.updatedAt).map(n=>`<article class="item"><div class="item-head"><div><div class="title">${esc(n.title||t('untitled'))}</div><div class="meta">${esc(fmtDateTime(n.updatedAt))}</div></div></div><div class="body">${esc(n.body||'')}</div><div class="actions"><button class="btn" data-edit="${n.id}">${esc(t('edit'))}</button><button class="btn" data-plan="${n.id}">${esc(t('plan'))}</button><button class="btn danger" data-del="${n.id}">${esc(t('delete'))}</button></div></article>`).join('');box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>selectNote(b.dataset.edit));box.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>makePlanFromNote(b.dataset.plan));box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteNote(b.dataset.del));}

function makePlanFromNote(id){const n=notes.notes.find(x=>x.id===id);if(!n)return;notes.selectedId=id;notes.plans[id]=(n.body||'').split(/\\r?\\n/).map(s=>s.trim()).filter(Boolean).map(text=>({text,status:''}));saveNotes();renderNotes();toast(t('makePlan'));}
function deleteNote(id){notes.notes=notes.notes.filter(n=>n.id!==id);delete notes.plans[id];if(notes.selectedId===id)notes.selectedId=notes.notes.slice().sort((a,b)=>b.updatedAt-a.updatedAt)[0]?.id||null;saveNotes();renderNotes();updateDashboard();toast(t('delete'));}
$('#notePicker').onchange=e=>selectNote(e.target.value);$('#newNote').onclick=()=>{notes.selectedId=null;$('#noteTitle').value='';$('#noteBody').value='';renderNoteSelect();renderPlans();$('#noteTitle').focus()};$('#saveNote').onclick=()=>{const title=$('#noteTitle').value.trim(),body=$('#noteBody').value;if(!title&&!body){toast(t('noNotes'));return};let n=notes.notes.find(x=>x.id===notes.selectedId);if(!n){n={id:uid(),title,body,updatedAt:Date.now()};notes.notes.push(n);notes.selectedId=n.id}else{n.title=title;n.body=body;n.updatedAt=Date.now()}saveNotes();renderNotes();updateDashboard();toast(t('saveNote'));};$('#deleteNote').onclick=()=>notes.selectedId&&deleteNote(notes.selectedId);$('#makePlan').onclick=()=>notes.selectedId?makePlanFromNote(notes.selectedId):toast(t('noNotes'));
function renderNotes(){renderNoteSelect();renderNoteList();renderPlans();}

let steps=read(KEYS.steps,{days:{}});if(!steps||typeof steps.days!=='object')steps={days:{}};const currentSteps=()=>Number(steps.days[todayKey()]||0);$('#saveSteps').onclick=()=>{steps.days[todayKey()]=Math.max(0,Math.floor(Number($('#stepsInput').value)||0));write(KEYS.steps,steps);renderSteps();updateDashboard();toast(t('save'));};
function renderSteps(){const d=new Date();$('#stepsDateLabel').textContent=new Intl.DateTimeFormat(lang==='ru'?'ru-RU':'en-GB',{day:'2-digit',month:'short'}).format(d);$('#stepBig').textContent=currentSteps().toLocaleString(lang==='ru'?'ru-RU':'en-US');$('#stepsInput').value=currentSteps()||'';drawSteps();}
function drawSteps(){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),count=daysInMonth(y,m),vals=Array.from({length:count},(_,i)=>Number(steps.days[`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`]||0)),max=Math.max(1,...vals);$('#stepsChart').innerHTML=`<div class="bars">${vals.map((v,i)=>`<div class="bar-col"><div class="bar-val">${v?Math.round(v).toLocaleString(lang==='ru'?'ru-RU':'en-US'):''}</div><div class="bar" style="height:${Math.max(v?4:2,Math.round(v/max*225))}px" title="${i+1}: ${v}"></div><div class="bar-label">${i+1}</div></div>`).join('')}</div><div class="chart-foot"><span>01</span><span>${count}</span></div>`}

let habits=read(KEYS.habits,{items:[],marks:{}});if(!habits||!Array.isArray(habits.items)||typeof habits.marks!=='object')habits={items:[],marks:{}};
function habitMonth(){const d=new Date();return {y:d.getFullYear(),m:d.getMonth(),count:daysInMonth(d.getFullYear(),d.getMonth())}}
function renderHabitParent(){const sel=$('#habitParent');const mains=habits.items.filter(h=>h.type==='main');sel.innerHTML=`<option value="">${esc(t('selectParent'))}</option>`+mains.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('');}
function renderHabits(){renderHabitParent();const wrap=$('#habitTableWrap');if(!habits.items.length){wrap.innerHTML=`<div class="empty">${esc(t('noHabits'))}</div>`;return};const {y,m,count}=habitMonth(),mk=`${y}-${String(m+1).padStart(2,'0')}`;let head='<thead><tr><th>Habit</th>';for(let d=1;d<=count;d++){head+=`<th>${d}</th>`;if(d%7===0||d===count)head+=`<th class="week-total">${esc(t('weeklyTotal'))}</th>`}head+='</tr></thead>';let body='<tbody>';habits.items.forEach(h=>{body+=`<tr class="${h.type==='main'?'main':''}"><td>${h.type==='main'?`<span class="habit-main-name">${esc(h.name)}</span>`:`<span class="habit-sub-name">${esc(h.name)}</span>`}</td>`;let done=0;for(let d=1;d<=count;d++){const key=`${mk}:${h.id}:${d}`,st=habits.marks[key]||'';if(st==='y')done++;body+=`<td><button class="habit-cell ${st}" data-h="${h.id}" data-d="${d}">${st==='y'?'✓':st==='n'?'✗':''}</button></td>`;if(d%7===0||d===count){const segment=d%7===0?7:d%7;body+=`<td class="week-total">${done}/${segment}</td>`;done=0}}body+='</tr>'});body+='</tbody>';wrap.innerHTML=`<table class="habit-table">${head}${body}</table>`;wrap.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const key=`${mk}:${b.dataset.h}:${b.dataset.d}`,st=habits.marks[key]||'';habits.marks[key]=st===''?'y':st==='y'?'n':'';write(KEYS.habits,habits);renderHabits();updateDashboard();})}
$('#habitType').onchange=()=>$('#parentField').style.display=$('#habitType').value==='sub'?'block':'none';$('#addHabit').onclick=()=>{const name=$('#habitName').value.trim(),type=$('#habitType').value,parent=$('#habitParent').value;if(!name)return;if(type==='sub'&&!parent){toast(t('selectParent'));return}habits.items.push({id:uid(),name,type,parentId:type==='sub'?parent:null});write(KEYS.habits,habits);$('#habitName').value='';renderHabits();updateDashboard();toast(t('addHabit'));};$('#clearHabits').onclick=()=>{if(confirm(t('confirmClear'))){habits={items:[],marks:{}};write(KEYS.habits,habits);renderHabits();updateDashboard();}};
function habitStats(){const {y,m,count}=habitMonth(),mk=`${y}-${String(m+1).padStart(2,'0')}`;let done=0,marked=0;habits.items.forEach(h=>{for(let d=1;d<=count;d++){const st=habits.marks[`${mk}:${h.id}:${d}`]||'';if(st==='y')done++;if(st!=='')marked++}});return {done,marked,pct:marked?Math.round(done/marked*100):0}}

let timerData=read(KEYS.timer,{sessions:[]});if(!timerData||!Array.isArray(timerData.sessions))timerData={sessions:[]};let timerMs=0,timerRunning=false,timerStartedAt=0,timerInterval=0;
function formatMs(ms){let s=Math.min(36000,Math.floor(ms/1000)),h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60),sec=s%60;return [h,m,sec].map(v=>String(v).padStart(2,'0')).join(':')}function effectiveMs(){return timerRunning?Math.min(36000000,timerMs+Date.now()-timerStartedAt):timerMs}function renderClock(){$('#clock').textContent=formatMs(effectiveMs());$('#timerState').textContent=timerRunning?t('running'):t('ready')}
function startTimer(){if(effectiveMs()>=36000000){toast(t('limit'));return}if(timerRunning)return;timerMs=effectiveMs();timerStartedAt=Date.now();timerRunning=true;clearInterval(timerInterval);timerInterval=setInterval(renderClock,250);renderClock()}function pauseTimer(){if(!timerRunning)return;timerMs=Math.min(36000000,effectiveMs());timerRunning=false;clearInterval(timerInterval);renderClock()}function resetTimer(){pauseTimer();timerMs=0;renderClock()}function mondayStart(d){const x=new Date(d),day=x.getDay()||7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day+1);return x}
function renderTimer(){renderClock();const now=new Date(),ws=mondayStart(now),we=new Date(ws);we.setDate(we.getDate()+7);const prev=new Date(ws);prev.setDate(prev.getDate()-7),pwe=new Date(ws);const cur=timerData.sessions.filter(s=>new Date(s.date)>=ws&&new Date(s.date)<we),past=timerData.sessions.filter(s=>new Date(s.date)>=prev&&new Date(s.date)<pwe),best=cur.length?Math.max(...cur.map(s=>s.ms)):0,prevBest=past.length?Math.max(...past.map(s=>s.ms)):0;let analysis=t('noSavedThisWeek');if(best)analysis=t('bestThisWeek',{n:Math.round(best/60000)})+(prevBest?' '+t('vsLastWeek',{n:Math.abs(Math.round((best-prevBest)/60000)),dir:best>=prevBest?t('higher'):t('lower')}):'');$('#timerAnalysis').textContent=analysis;$('#timerHistory').innerHTML=timerData.sessions.length?timerData.sessions.slice().sort((a,b)=>b.date-a.date).slice(0,20).map(s=>`<div class="history-item"><span>${esc(fmtDateTime(s.date))}</span><b>${formatMs(s.ms)}</b></div>`).join(''):`<div class="empty">${esc(t('noSessions'))}</div>`}
$('#timerStart').onclick=startTimer;$('#timerPause').onclick=pauseTimer;$('#timerReset').onclick=resetTimer;$('#timerSave').onclick=()=>{pauseTimer();const ms=Math.min(timerMs,36000000);if(ms<1000){toast(t('nothingToSave'));return}timerData.sessions.push({id:uid(),date:Date.now(),ms});write(KEYS.timer,timerData);timerMs=0;renderTimer();updateDashboard();toast(t('sessionSaved'));};

let finance=read(KEYS.finance,{start:0,operations:[]});if(!finance||!Array.isArray(finance.operations))finance={start:Number(finance?.start||0),operations:[]};let calcValue='0',calcType='income';
function updateCalc(){$('#calcDisplay').textContent=Number(calcValue||0).toLocaleString(lang==='ru'?'ru-RU':'en-US')}function setCalcType(type){calcType=type;$('#incomeType').classList.toggle('active',type==='income');$('#expenseType').classList.toggle('active',type==='expense')}$$('.type-btn').forEach(b=>b.onclick=()=>setCalcType(b.dataset.type));$$('.key').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(k==='clear')calcValue='0';else if(k==='back')calcValue=calcValue.length>1?calcValue.slice(0,-1):'0';else if(calcValue==='0')calcValue=k;else if(calcValue.length<12)calcValue+=k;updateCalc();});$('#opDate').value=todayKey();
function renderFinance(){const balance=Number(finance.start||0)+finance.operations.reduce((a,o)=>a+Number(o.amount||0),0),ym=monthKey(),monthOps=finance.operations.filter(o=>String(o.date).slice(0,7)===ym),spend=monthOps.filter(o=>Number(o.amount)<0).reduce((a,o)=>a+Math.abs(Number(o.amount)),0),income=monthOps.filter(o=>Number(o.amount)>0).reduce((a,o)=>a+Number(o.amount),0),largest=monthOps.filter(o=>Number(o.amount)<0).sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount))[0];$('#startBalanceDisplay').textContent=money(finance.start);$('#financeBalance').textContent=money(balance);$('#monthlySpend').textContent=money(spend);$('#largestPurchase').textContent=money(largest?Math.abs(largest.amount):0);$('#largestPurchaseName').textContent=largest?(largest.description||t('purchase')):t('noExpenses');$('#operationList').innerHTML=finance.operations.length?finance.operations.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(o=>`<div class="op"><div><div style="font-weight:650">${esc(o.description||t('purchase'))}</div><div class="op-date">${esc(o.date)}</div></div><div class="op-amt ${Number(o.amount)>=0?'positive':'negative'}">${Number(o.amount)>=0?'+':''}${money(o.amount)}</div><button class="btn icon danger" data-del-op="${o.id}">×</button></div>`).join(''):`<div class="empty">${esc(t('noOperations'))}</div>`;$('#operationList').querySelectorAll('[data-del-op]').forEach(b=>b.onclick=()=>{finance.operations=finance.operations.filter(o=>o.id!==b.dataset.delOp);write(KEYS.finance,finance);renderFinance();updateDashboard();toast(t('operationDeleted'));});const mx=Math.max(1,income,spend);$('#financeChart').innerHTML=`<div class="fin-bars"><div class="fin-col"><div class="fin-value">${money(income)}</div><div class="fin-track"><div class="fin-fill" style="height:${Math.max(4,Math.round(income/mx*130))}px"></div></div><div class="fin-label">${esc(t('income'))}</div></div><div class="fin-col"><div class="fin-value">${money(spend)}</div><div class="fin-track"><div class="fin-fill" style="height:${Math.max(4,Math.round(spend/mx*130))}px"></div></div><div class="fin-label">${esc(t('expense'))}</div></div></div>`}
$('#editStartBalance').onclick=()=>{const v=prompt(t('promptStart'),String(finance.start??0));if(v===null)return;const n=Number(String(v).replace(',','.'));if(!Number.isFinite(n)){toast(t('invalidAmount'));return}finance.start=n;write(KEYS.finance,finance);renderFinance();updateDashboard();toast(t('save'));};$('#addOperation').onclick=()=>{const raw=Number(calcValue||0);if(!Number.isFinite(raw)||raw<=0){toast(t('enterAmount'));return}const amount=(calcType==='income'?1:-1)*raw;finance.operations.push({id:uid(),amount,description:$('#opDescription').value.trim(),date:$('#opDate').value||todayKey()});write(KEYS.finance,finance);calcValue='0';updateCalc();$('#opDescription').value='';renderFinance();updateDashboard();toast(t('operationAdded'));};

let schedule=read(KEYS.schedule,{weekday:new Date().getDay(),month:new Date().getMonth(),day:new Date().getDate(),tasks:{}});if(!schedule||typeof schedule!=='object')schedule={weekday:new Date().getDay(),month:new Date().getMonth(),day:new Date().getDate(),tasks:{}};if(!schedule.tasks)schedule.tasks={};
function populateDateControls(){$('#schedWeekday').innerHTML=dayNames[lang].map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('');$('#schedMonth').innerHTML=monthNames[lang].map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('');$('#schedWeekday').value=String(schedule.weekday);$('#schedMonth').value=String(schedule.month)}
function renderSchedule(){populateDateControls();$('#schedDay').value=schedule.day;let out='';for(let h=6;h<=23;h++){const key=`${String(h).padStart(2,'0')}:00`,val=schedule.tasks[key]||'';out+=`<div class="slot ${val.trim()?'filled':''}"><time>${key}</time><input data-slot="${key}" value="${esc(val)}" placeholder="${esc(t('taskPh',{time:key}))}"><span class="slot-dot"></span></div>`}$('#scheduleList').innerHTML=out;$('#scheduleList').querySelectorAll('[data-slot]').forEach(i=>i.onchange=()=>{schedule.tasks[i.dataset.slot]=i.value;write(KEYS.schedule,schedule);i.parentElement.classList.toggle('filled',!!i.value.trim());updateDashboard();})}
$('#saveScheduleDate').onclick=()=>{schedule.weekday=Number($('#schedWeekday').value);schedule.month=Number($('#schedMonth').value);schedule.day=clamp(Math.floor(Number($('#schedDay').value)||1),1,31);write(KEYS.schedule,schedule);renderSchedule();updateDashboard();toast(t('dateSaved'));};$('#fillToday').onclick=()=>{const d=new Date();schedule.weekday=d.getDay();schedule.month=d.getMonth();schedule.day=d.getDate();write(KEYS.schedule,schedule);renderSchedule();updateDashboard();toast(t('deviceDate'));};

function focusToday(){const k=todayKey();return timerData.sessions.filter(s=>new Date(s.date).toISOString().slice(0,10)===k).reduce((a,s)=>a+s.ms,0)+(timerRunning?effectiveMs():0)}
function updateDashboard(){const latest=notes.notes.slice().sort((a,b)=>b.updatedAt-a.updatedAt)[0];$('#dashNote').textContent=latest?.body||t('noNotes');$('#dashSteps').textContent=currentSteps().toLocaleString(lang==='ru'?'ru-RU':'en-US');const hs=habitStats();$('#dashHabit').textContent=hs.pct+'%';$('#dashHabitBar').style.width=hs.pct+'%';$('#dashHabitMeta').textContent=`${hs.done} / ${hs.marked} ${t('checks')}`;$('#dashFocus').textContent=formatMs(focusToday());const balance=Number(finance.start||0)+finance.operations.reduce((a,o)=>a+Number(o.amount||0),0);$('#dashBalance').textContent=money(balance);$('#dashDate').textContent=schedule.day?`${schedule.day} ${monthNames[lang][Number(schedule.month)]}`:'—';$('#dashDay').textContent=dayNames[lang][Number(schedule.weekday)]||''}
let activePage=read(KEYS.page,'dashboard');function go(page){activePage=page;write(KEYS.page,page);$$('.page').forEach(p=>p.classList.toggle('active',p.id===page));$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));window.scrollTo({top:0,behavior:'smooth'})}$$('.nav-btn').forEach(b=>b.onclick=()=>go(b.dataset.page));
function renderAll(){applyI18n();renderNotes();renderSteps();renderHabits();renderTimer();renderFinance();renderSchedule();updateDashboard();go(activePage)}
let deferredInstall=null;
const installBtn=$('#installApp');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(installBtn)installBtn.classList.add('show');});
window.addEventListener('appinstalled',()=>{deferredInstall=null;if(installBtn)installBtn.classList.remove('show');});
if(installBtn){installBtn.onclick=async()=>{if(!deferredInstall){toast(location.protocol==='file:'?t('installHintFile'):t('installHintBrowser'));return}deferredInstall.prompt();try{await deferredInstall.userChoice}catch{}deferredInstall=null;installBtn.classList.remove('show');};}
try{
  if('serviceWorker' in navigator && (location.protocol==='http:' || location.protocol==='https:')){
    navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
  }
}catch{}
renderAll();setInterval(()=>{if(timerRunning){renderClock();updateDashboard()}},1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderClock();updateDashboard()}});
})();
</script>
</body></html>
